<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mô hình Thiên Cầu 3D</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            width: 400px;
            height: 400px;
            perspective: 1200px;
        }

        .celestial-sphere {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateSphere 25s linear infinite;
        }

        /* Tâm Trái Đất */
        .earth {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8), inset -5px -5px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }

        /* Các vòng tròn thiên cầu */
        .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        /* Xích đạo trời (Celestial Equator) - Màu xanh dương sáng */
        .equator {
            border: 3px solid #38bdf8;
            transform: rotateX(90deg);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        /* Vòng Hoàng Đạo (Ecliptic) - Màu vàng nghiêng */
        .ecliptic {
            border: 3px solid #fbbf24;
            transform: rotateX(65deg) rotateY(25deg);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }

        /* Kinh tuyến trời / Trục */
        .meridian {
            border: 2px solid rgba(244, 63, 94, 0.5);
            transform: rotateY(90deg);
        }

        /* Nhãn chú thích 3D */
        .label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .lbl-eq { background: #38bdf8; color: #000; top: 10%; right: 10%; }
        .lbl-ec { background: #fbbf24; color: #000; bottom: 15%; left: 5%; }
        .lbl-earth { background: #ffffff; color: #000; top: 48%; left: 55%; font-size: 11px; }

        @keyframes rotateSphere {
            from { transform: rotateX(20deg) rotateY(0deg); }
            to { transform: rotateX(20deg) rotateY(360deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="celestial-sphere">
            <!-- Trái Đất -->
            <div class="earth"></div>
            
            <!-- Vòng Xích đạo trời -->
            <div class="ring equator"></div>
            
            <!-- Vòng Hoàng đạo -->
            <div class="ring ecliptic"></div>
            
            <!-- Vòng kinh tuyến -->
            <div class="ring meridian"></div>
        </div>
    </div>

</body>
</html>
